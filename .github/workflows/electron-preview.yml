name: Latest Electron preview
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: electron-preview-0.4.0
  cancel-in-progress: false
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-22.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-amd64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and prepare unchanged media from the last native release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: |
          git fetch --depth=1 origin tag v0.3.2-browser-preview.1
          git diff v0.3.2-browser-preview.1 --exit-code -- scripts/build_media.py scripts/media-sources.json
          mkdir -p seed
          gh release download v0.3.2-browser-preview.1 --pattern "VideoFlow-$TARGET.zip" --pattern SHA256SUMS.txt --dir seed
          python3 - <<'PYVERIFY'
          import hashlib, os
          from pathlib import Path
          name = 'VideoFlow-' + os.environ['TARGET'] + '.zip'
          hashes = {line.split()[1]: line.split()[0] for line in Path('seed/SHA256SUMS.txt').read_text().splitlines()}
          assert hashlib.sha256(Path('seed', name).read_bytes()).hexdigest() == hashes[name], 'Native seed checksum mismatch'
          PYVERIFY
          python3 scripts/prepare_electron.py --archive "seed/VideoFlow-$TARGET.zip" --target "$TARGET"
      - name: Rebuild the current backend
        run: go build -trimpath -o electron/payload/VideoFlow/videoflow ./cmd/server
      - name: Test using only bundled media tools
        env:
          MEDIA_TARGET: ${{ matrix.target }}
        run: |
          export PATH="$PWD/electron/payload/VideoFlow:$PATH"
          go test -race ./...
          go vet ./...
      - run: npm ci && npm run check && npm run build
        working-directory: frontend
      - name: Replace the entire bundled interface and guides with the current source
        run: |
          python3 - <<'PYCOPY'
          import shutil
          from pathlib import Path
          payload = Path('electron/payload/VideoFlow')
          shutil.rmtree(payload / 'frontend')
          shutil.copytree('frontend/build', payload / 'frontend')
          shutil.copyfile('llms.txt', payload / 'llms.txt')
          shutil.copyfile('docs/ELECTRON-START-HERE.txt', payload / 'START HERE.txt')
          PYCOPY
      - run: python3 scripts/test_prepare_electron.py
      - run: npm ci && npm test
        working-directory: electron
      - name: Test engine listener and shutdown
        run: VIDEOFLOW_INTEGRATION=1 npm test
        working-directory: electron
      - name: Prepare Linux display
        if: runner.os == 'Linux'
        run: |
          # Hosted mirror lists can retain an unreachable Azure mirror. Use
          # Ubuntu's official signed repositories for this ephemeral runner.
          sudo python3 - <<'PYAPT'
          import platform
          from pathlib import Path
          mirror = 'https://ports.ubuntu.com/ubuntu-ports/' if platform.machine() in ('aarch64', 'arm64') else 'https://archive.ubuntu.com/ubuntu/'
          for path in Path('/etc/apt').glob('apt-mirrors*.txt'):
              path.write_text(mirror + '\n')
          paths = [Path('/etc/apt/sources.list'), *Path('/etc/apt/sources.list.d').glob('ubuntu.sources')]
          for path in paths:
              if path.exists():
                  text = path.read_text().replace('http://azure.archive.ubuntu.com/ubuntu/', mirror).replace('http://azure.ports.ubuntu.com/ubuntu-ports/', mirror)
                  path.write_text(text)
          PYAPT
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=2 install -y xvfb
      - name: Package macOS ad-hoc preview
        if: runner.os == 'macOS'
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        working-directory: electron
        run: |
          case "$NATIVE_TARGET" in
            darwin-amd64) npm run dist -- --config macos-preview.json --mac --x64 --publish never ;;
            darwin-arm64) npm run dist -- --config macos-preview.json --mac --arm64 --publish never ;;
          esac
      - name: Package Linux desktop app
        if: runner.os == 'Linux'
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        working-directory: electron
        run: |
          case "$NATIVE_TARGET" in
            linux-amd64) npm run dist -- --linux --x64 --publish never ;;
            linux-arm64) npm run dist -- --linux --arm64 --publish never ;;
          esac
      - name: Install the Linux package with the default OS sandbox policy
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ./dist/electron/*.deb
      - name: Verify the packaged app window and engine cleanup
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        run: |
          case "$NATIVE_TARGET" in
            darwin-amd64) python3 scripts/smoke_electron.py --executable dist/electron/mac/VideoFlow.app/Contents/MacOS/VideoFlow ;;
            darwin-arm64) python3 scripts/smoke_electron.py --executable dist/electron/mac-arm64/VideoFlow.app/Contents/MacOS/VideoFlow ;;
            linux-amd64) xvfb-run -a python3 scripts/smoke_electron.py --executable /usr/bin/videoflow-desktop ;;
            linux-arm64) xvfb-run -a python3 scripts/smoke_electron.py --executable /usr/bin/videoflow-desktop ;;
          esac
      - name: Verify the downloaded macOS ZIP against Gatekeeper
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/macos-download-check
          ditto -x -k dist/electron/*.zip dist/macos-download-check
          xattr -w com.apple.quarantine '0083;00000000;VideoFlowReleaseCheck;' dist/macos-download-check/VideoFlow.app
          python3 scripts/audit_macos.py --app dist/macos-download-check/VideoFlow.app --output dist/macos-download-check/report.json --require-valid-signature
          python3 scripts/smoke_electron.py --executable dist/macos-download-check/VideoFlow.app/Contents/MacOS/VideoFlow
      - uses: actions/upload-artifact@v4
        with:
          name: VideoFlow-Electron-${{ matrix.target }}
          path: |
            dist/electron/*.dmg
            dist/electron/*.zip
            dist/electron/*.deb
            dist/electron/*.AppImage
            dist/electron/*.tar.gz
  publish:
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: VideoFlow-Electron-*
          merge-multiple: true
          path: dist/electron
      - run: cp llms.txt dist/electron/llms.txt
      - name: Checksum the native installers
        working-directory: dist/electron
        run: sha256sum *.deb *.dmg *.zip *.AppImage *.tar.gz llms.txt > SHA256SUMS.txt
      - name: Publish verified desktop packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.4.0-electron-preview.1
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" dist/electron/*.deb dist/electron/*.dmg dist/electron/*.zip dist/electron/*.AppImage dist/electron/*.tar.gz dist/electron/SHA256SUMS.txt dist/electron/llms.txt --target "$GITHUB_SHA" --title 'VideoFlow 0.4.0 — new Studio & Settings (Electron preview)' --notes-file docs/electron-0.4.0-release.md --prerelease
          fi
