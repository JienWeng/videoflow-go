name: Audit downloaded macOS release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Download the reported release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p audit
          gh release download v0.3.0-electron.1 --pattern "VideoFlow-0.3.0-mac-$ARCH.zip" --dir audit
          ditto -x -k "audit/VideoFlow-0.3.0-mac-$ARCH.zip" audit/extracted
      - name: Reproduce downloaded-app policy
        run: |
          xattr -w com.apple.quarantine '0083;00000000;VideoFlowReleaseAudit;' audit/extracted/VideoFlow.app
          python3 scripts/audit_macos.py --app audit/extracted/VideoFlow.app --output audit/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: macOS-release-audit-${{ matrix.arch }}
          path: audit/report.json
