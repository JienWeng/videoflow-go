name: Beginner downloads
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: go test -race ./...
      - run: go vet ./...
      - run: npm ci && npm run check && npm run build
        working-directory: frontend
      - run: python3 scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: VideoFlow-downloads
          path: dist/*
      - name: Publish tagged downloads
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" dist/* --title "VideoFlow $GITHUB_REF_NAME" --notes-file docs/release-notes.md --prerelease
          fi
