<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VideoFlow Studio</title>
    <!--
      Apply the saved theme BEFORE first paint so dark (the default) never
      flashes light during hydration. The +layout ModeWatcher keeps this in
      sync afterwards; this inline copy only matters for the very first paint.
    -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('videoflow.theme') || 'dark';
          var dark =
            pref === 'dark' ||
            (pref === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
