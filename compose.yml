services:
  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    environment:
      FISH_API_KEY: ${FISH_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
    volumes:
      - videoflow-data:/data
      - videoflow-agent-auth:/home/videoflow
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  videoflow-data:
  videoflow-agent-auth:
