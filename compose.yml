services:
  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
      args:
        # 1 adds earshot's listening models (about 1.1 GB, fetched at build time); see docs/handbook/10-ai-editor.md
        EARSHOT_LISTEN: ${EARSHOT_LISTEN:-0}
    environment:
      VIDEOFLOW_DISABLE_CODEX_IMAGES: ${VIDEOFLOW_DISABLE_CODEX_IMAGES:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-}
      FISH_API_KEY: ${FISH_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
    volumes:
      - videoflow-data:/data
      - videoflow-agent-auth:/home/videoflow
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  videoflow-data:
  videoflow-agent-auth:
